name: CI - car-rental-service

on:
  push:
    branches: [main]
    paths:
      - 'apps/car-rental-service/**'
      - '.github/workflows/ci-car-rental.yml'
  pull_request:
    branches: [main, 'base/00-starter']
  workflow_dispatch:

concurrency:
  group: car-rental-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/car-rental-service

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: corretto
          cache: gradle
          cache-dependency-path: |
            apps/car-rental-service/*.gradle
            apps/car-rental-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests
        working-directory: apps/car-rental-service
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            apps/car-rental-service/build/test-results/test/
            apps/car-rental-service/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: corretto
          cache: gradle
          cache-dependency-path: |
            apps/car-rental-service/*.gradle
            apps/car-rental-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run Checkstyle
        working-directory: apps/car-rental-service
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-quality-reports
          path: apps/car-rental-service/build/reports/checkstyle/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Java Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: apps/car-rental-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=car-rental-service
          cache-to: type=gha,scope=car-rental-service,mode=max

      - name: Scan published image with Trivy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-car-rental
