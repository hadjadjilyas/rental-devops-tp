name: CI - pricing-service

on:
  push:
    branches: [main]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'
  pull_request:
    branches: [main, 'base/00-starter']
  workflow_dispatch:

concurrency:
  group: pricing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pricing-service

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/pricing-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/pricing-service
        run: |
          mkdir -p build/test-results
          python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-reports
          path: apps/pricing-service/build/test-results/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/pricing-service
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: apps/pricing-service
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests

  docker:
    name: Python Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: apps/pricing-service
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pricing-service
          cache-to: type=gha,scope=pricing-service,mode=max

      - name: Scan published image with Trivy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pricing
